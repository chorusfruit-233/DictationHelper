name: Build & Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: false
      bundle_vosk:
        description: 'Also build APK with pre-installed Vosk models (CN+EN)'
        type: boolean
        default: true
      bundle_sherpa:
        description: 'Also build APK with the official sherpa-onnx streaming model (~511MB)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/dictation-helper.jks

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | grep -oP '"\K[^"]+')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build standard APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: dictation-helper.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Move standard APK
        run: |
          mv app/build/outputs/apk/release/*.apk \
            "DictationHelper-v${{ steps.version.outputs.version }}.apk"

      - name: Restore Vosk model cache
        if: ${{ inputs.bundle_vosk }}
        id: vosk-cache
        uses: actions/cache@v4
        with:
          path: /tmp/vosk-cache
          key: vosk-models-cn-en

      - name: Restore Gradle config cache
        uses: actions/cache@v4
        with:
          path: .gradle/configuration-cache
          key: gradle-config-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-config-

      - name: Download Vosk models
        if: ${{ inputs.bundle_vosk && steps.vosk-cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p /tmp/vosk-cache
          echo "Downloading vosk-model-small-cn-0.22 (~42MB)..."
          curl -L --connect-timeout 30 --max-time 600 \
            "https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip" \
            -o /tmp/vosk-cache/vosk_cn.zip
          echo "Downloading vosk-model-small-en-us-0.15 (~40MB)..."
          curl -L --connect-timeout 30 --max-time 600 \
            "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip" \
            -o /tmp/vosk-cache/vosk_en.zip

      - name: Extract Vosk models to assets
        if: ${{ inputs.bundle_vosk }}
        run: |
          mkdir -p app/src/main/assets/vosk_model_cn
          unzip -q /tmp/vosk-cache/vosk_cn.zip -d /tmp/vosk_cn
          mv /tmp/vosk_cn/*/* app/src/main/assets/vosk_model_cn/

          mkdir -p app/src/main/assets/vosk_model_en
          unzip -q /tmp/vosk-cache/vosk_en.zip -d /tmp/vosk_en
          mv /tmp/vosk_en/*/* app/src/main/assets/vosk_model_en/

      - name: Restore sherpa model cache
        if: ${{ inputs.bundle_sherpa }}
        id: sherpa-cache
        uses: actions/cache@v4
        with:
          path: /tmp/sherpa-cache
          key: sherpa-onnx-streaming-bilingual-zh-en-2023-02-20

      - name: Download sherpa model
        if: ${{ inputs.bundle_sherpa && steps.sherpa-cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p /tmp/sherpa-cache
          curl -L --connect-timeout 30 --max-time 1800 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20.tar.bz2" \
            -o /tmp/sherpa-cache/sherpa_model.tar.bz2

      - name: Extract sherpa model to assets
        if: ${{ inputs.bundle_sherpa }}
        run: |
          rm -rf /tmp/sherpa_model app/src/main/assets/sherpa_model_streaming
          mkdir -p /tmp/sherpa_model app/src/main/assets/sherpa_model_streaming
          tar -xjf /tmp/sherpa-cache/sherpa_model.tar.bz2 -C /tmp/sherpa_model
          MODEL_ROOT=$(find /tmp/sherpa_model -name tokens.txt -printf '%h\n' | head -1)
          test -n "$MODEL_ROOT"
          cp -a "$MODEL_ROOT"/. app/src/main/assets/sherpa_model_streaming/

      - name: Build APK with Vosk models
        if: ${{ inputs.bundle_vosk }}
        run: |
          rm -rf app/src/main/assets/sherpa_model_streaming
          ./gradlew clean assembleRelease
          unzip -l app/build/outputs/apk/release/*.apk | grep -q 'assets/vosk_model_cn/'
          unzip -l app/build/outputs/apk/release/*.apk | grep -q 'assets/vosk_model_en/'
          mv app/build/outputs/apk/release/*.apk \
            "DictationHelper-v${{ steps.version.outputs.version }}-with-vosk-models.apk"
        env:
          KEYSTORE_FILE: dictation-helper.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build APK with sherpa-onnx model
        if: ${{ inputs.bundle_sherpa }}
        run: |
          rm -rf app/src/main/assets/vosk_model_cn app/src/main/assets/vosk_model_en
          ./gradlew clean assembleRelease
          unzip -l app/build/outputs/apk/release/*.apk | grep -q 'assets/sherpa_model_streaming/'
          mv app/build/outputs/apk/release/*.apk \
            "DictationHelper-v${{ steps.version.outputs.version }}-with-sherpa-model.apk"
        env:
          KEYSTORE_FILE: dictation-helper.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DictationHelper-v${{ steps.version.outputs.version }}
          path: "*.apk"

      - name: Create Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
          tag_name: v${{ steps.version.outputs.version }}
          name: DictationHelper v${{ steps.version.outputs.version }}
          body: |
            ### 构建时间
            ${{ github.event.repository.updated_at }}

            ### APK
            - `DictationHelper-v${{ steps.version.outputs.version }}.apk` — 标准版
            ${{ inputs.bundle_vosk && format('- `DictationHelper-v{0}-with-vosk-models.apk` — 预装中/英文 Vosk 离线语音模型', steps.version.outputs.version) || '' }}
            ${{ inputs.bundle_sherpa && format('- `DictationHelper-v{0}-with-sherpa-model.apk` — 预装 sherpa-onnx 中英流式模型', steps.version.outputs.version) || '' }}

            ### License
            GPL-3.0-or-later

            Source code for this release is available from the corresponding Git tag.

            If this APK includes offline speech recognition models, see `THIRD_PARTY_LICENSES.md` for model sources and licenses.
          draft: false
          prerelease: false
